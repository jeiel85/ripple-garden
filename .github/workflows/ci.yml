name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  validate:
    name: Validate content and run Godot tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check version consistency
        run: python tools/check_version.py

      - name: Install Godot (checksum verified)
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          file="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$file" "$base/$file"
          curl -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          sha512sum -c --ignore-missing SHA512-SUMS.txt
          unzip -q "$file"
          echo "GODOT_BIN=$RUNNER_TEMP/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import project
        run: '"$GODOT_BIN" --headless --path godot --import'

      - name: Validate content data
        run: '"$GODOT_BIN" --headless --path godot -s res://tools/validate_content.gd'

      - name: Run Godot tests
        run: '"$GODOT_BIN" --headless --path godot -s res://tests/run_tests.gd'

  android:
    name: Build signed Android APK
    needs: validate
    # Pull requests from this repository (not forks: they get no secrets) and release tags.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      # Certificate of the Ripple Garden upload key (D-038): a build signed with anything else fails here.
      EXPECTED_CERT_SHA256: 646b2f100ed674e9178fa1d013f4ca24291b0fb4bfc8b260e890b7340f4b08a1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Godot and the Android export template (checksum verified)
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          editor="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          templates="Godot_v${GODOT_VERSION}_export_templates.tpz"
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$editor" "$base/$editor"
          curl -fsSL -o "$templates" "$base/$templates"
          curl -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          sha512sum -c --ignore-missing SHA512-SUMS.txt
          unzip -q "$editor"
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$template_dir"
          unzip -q -j "$templates" templates/android_release.apk templates/version.txt -d "$template_dir"
          echo "GODOT_BIN=$RUNNER_TEMP/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Point Godot at the Android SDK and a throwaway debug key
        run: |
          debug="$RUNNER_TEMP/debug.keystore"
          keytool -genkeypair -keystore "$debug" -storepass android -keypass android -alias androiddebugkey             -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          major_minor=$(echo "$GODOT_VERSION" | cut -d. -f1,2)
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${major_minor}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$debug"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Export and sign the release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          "$GODOT_BIN" --headless --path godot --import
          mkdir -p build/android
          "$GODOT_BIN" --headless --path godot --export-release "Android" ../build/android/RippleGarden.apk
          rm -f "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          test -f build/android/RippleGarden.apk || { echo "::error::Export produced no APK"; exit 1; }

      - name: Check the signing certificate
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          cert=$("$apksigner" verify --print-certs build/android/RippleGarden.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "certificate: $cert"
          if [ "$cert" != "$EXPECTED_CERT_SHA256" ]; then echo "::error::APK is not signed with the Ripple Garden upload key"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/RippleGarden.apk
          retention-days: 7

  release:
    name: Build Windows release
    needs: [validate, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check tag matches game version
        run: python tools/check_version.py "${{ github.ref_name }}"

      - name: Install Godot and Windows export templates (checksum verified)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION"
          $dir = "$env:RUNNER_TEMP\godot"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Set-Location $dir
          $editor = "Godot_v$($env:GODOT_VERSION)_win64.exe.zip"
          $templates = "Godot_v$($env:GODOT_VERSION)_export_templates.tpz"
          curl.exe -fsSL -o $editor "$base/$editor"
          curl.exe -fsSL -o $templates "$base/$templates"
          curl.exe -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          foreach ($file in @($editor, $templates)) {
            $line = Select-String -Path SHA512-SUMS.txt -SimpleMatch " $file" | Select-Object -First 1
            if (-not $line) { throw "No checksum listed for $file" }
            $expected = ($line.Line -split '\s+')[0]
            $actual = (Get-FileHash -Algorithm SHA512 $file).Hash
            if ($actual -ne $expected) { throw "Checksum mismatch for $file" }
          }
          7z x $editor -o"$dir" | Out-Null
          $templateVersion = $env:GODOT_VERSION -replace '-', '.'
          $templateDir = "$env:APPDATA\Godot\export_templates\$templateVersion"
          New-Item -ItemType Directory -Force -Path $templateDir | Out-Null
          7z e $templates templates/windows_release_x86_64.exe templates/version.txt -o"$templateDir" | Out-Null
          "GODOT_BIN=$dir\Godot_v$($env:GODOT_VERSION)_win64_console.exe" >> $env:GITHUB_ENV

      - name: Export Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:GODOT_BIN --headless --path godot --import
          New-Item -ItemType Directory -Force -Path build\windows | Out-Null
          & $env:GODOT_BIN --headless --path godot --export-release "Windows Desktop" ..\build\windows\RippleGarden.exe
          if (-not (Test-Path build\windows\RippleGarden.exe)) { throw "Export produced no executable" }

      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-apk

      - name: Package and publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist\RippleGarden-$tag-windows-x64.zip"
          Compress-Archive -Path build\windows\* -DestinationPath $zip
          $apk = "dist\RippleGarden-$tag-android.apk"
          Move-Item android-apk\RippleGarden.apk $apk
          # LF line endings so `sha256sum -c` works on Linux/macOS/Git Bash.
          $sums = foreach ($file in @($zip, $apk)) { "$((Get-FileHash -Algorithm SHA256 $file).Hash.ToLower())  $(Split-Path $file -Leaf)" }
          [IO.File]::WriteAllText("$PWD\dist\SHA256SUMS.txt", (($sums -join "`n") + "`n"))
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $apk dist\SHA256SUMS.txt --clobber
          } else {
            # A release candidate tag (vX.Y.Z-rc.N) is published as a prerelease (D-037).
            $extra = @()
            if ($tag -match '-rc\.\d+$') { $extra += '--prerelease' }
            gh release create $tag $zip $apk dist\SHA256SUMS.txt --title "Ripple Garden $tag" --generate-notes @extra
          }
